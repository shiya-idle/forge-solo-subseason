plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "forge_solo_subseason" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.fabric_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation project(':core-api')
    implementation project(':module-skills')
    implementation project(':module-claims')
    implementation 'org.yaml:snakeyaml:2.4'

    // These are runtime libraries used directly by the Fabric entrypoint.
    // Nest them in the distributable mod JAR so a server only needs the one Fern JAR.
    include project(':core-api')
    include project(':module-skills')
    include project(':module-claims')
    include 'org.yaml:snakeyaml:2.4'
}

processResources {
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
