    repositories {
        maven { url = uri('https://maven.fabricmc.net/') }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'forge-solo-subseason'

include 'core-api', 'core-common', 'module-data', 'module-ledger', 'module-classes', 'module-season', 'module-routes', 'module-skills', 'module-mobs-coins', 'module-quests', 'module-orbs', 'module-boombai', 'module-leveling', 'module-claims', 'platform-paper', 'platform-velocity', 'platform-fabric'
